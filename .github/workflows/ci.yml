name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Отменяем устаревшие прогоны только в PR: каждый коммит main должен пройти CI до конца.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Имена заданий — «build (debug)» и «build (release)»: они станут обязательными проверками main (#3).
    name: build (${{ matrix.preset }})
    # windows-2022, а не windows-latest: в latest нет VS 2022 (docs/adr/0001-ci-runner.md).
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Check static CRT (NFR-2)
        if: matrix.preset == 'release'
        shell: pwsh
        run: ./.github/scripts/check-static-crt.ps1 build/release/bin/Release/cube_snake.exe

      - name: Upload cube_snake.exe
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v5
        with:
          # В pull_request github.sha — merge-коммит; берём head ветки, чтобы артефакт совпадал с коммитом PR.
          name: cube_snake-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/release/bin/Release/cube_snake.exe
          if-no-files-found: error
